<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Auto-Doc Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; }
        .navbar { background: #161b22; border-bottom: 1px solid #30363d; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        .navbar h1 { font-size: 18px; color: #58a6ff; }
        .navbar button { padding: 6px 16px; background: #21262d; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; cursor: pointer; font-size: 13px; }
        .navbar button:hover { background: #30363d; }
        .layout { display: flex; min-height: calc(100vh - 57px); }
        .sidebar { width: 260px; background: #161b22; border-right: 1px solid #30363d; padding: 16px; overflow-y: auto; }
        .sidebar h2 { font-size: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        .project { margin-bottom: 8px; }
        .project-name { padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; color: #8b949e; display: flex; align-items: center; gap: 8px; }
        .project-name:hover { background: #21262d; color: #e6edf3; }
        .project-name.active { background: #21262d; color: #58a6ff; }
        .project-files { padding-left: 16px; margin-top: 4px; }
        .file-item { padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; color: #8b949e; }
        .file-item:hover { background: #21262d; color: #e6edf3; }
        .file-item.active { color: #58a6ff; }
        .main { flex: 1; padding: 24px; overflow-y: auto; }
        .welcome { text-align: center; padding: 80px 20px; color: #8b949e; }
        .welcome h2 { font-size: 24px; margin-bottom: 8px; color: #e6edf3; }
        .doc-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 24px; margin-bottom: 16px; }
        .doc-card h3 { font-size: 16px; color: #58a6ff; font-family: monospace; margin-bottom: 12px; }
        .doc-content { font-size: 14px; line-height: 1.6; color: #c9d1d9; white-space: pre-wrap; }
        .loading { text-align: center; padding: 40px; color: #8b949e; }
        .empty { text-align: center; padding: 40px; color: #8b949e; }
        .login-prompt { text-align: center; padding: 80px 20px; }
        .login-prompt h2 { color: #e6edf3; margin-bottom: 12px; }
        .login-prompt a { color: #58a6ff; text-decoration: none; }
        .token-input { display: flex; gap: 8px; max-width: 500px; margin: 20px auto; }
        .token-input input { flex: 1; padding: 10px 14px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-size: 14px; outline: none; }
        .token-input input:focus { border-color: #58a6ff; }
        .token-input button { padding: 10px 20px; background: #238636; border: none; border-radius: 6px; color: white; cursor: pointer; font-size: 14px; }
        .token-input button:hover { background: #2ea043; }
        .error-msg { color: #f85149; text-align: center; font-size: 13px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>⚡ Auto-Doc Agent</h1>
        <div style="display:flex;gap:8px;align-items:center;">
            <span id="user-email" style="font-size:13px;color:#8b949e;"></span>
            <button onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="login-prompt" class="login-prompt" style="display:none;">
        <h2>🔒 Enter your API key to view your documentation</h2>
        <p style="color:#8b949e;margin-bottom:16px;">Get your API key from <a href="/">auto-doc-agent.onrender.com</a></p>
        <div class="token-input">
            <input type="text" id="token-input" placeholder="Paste your API key here..." />
            <button onclick="loadWithToken()">Enter</button>
        </div>
        <div id="token-error" class="error-msg"></div>
    </div>

    <div id="app-layout" class="layout" style="display:none;">
        <div class="sidebar">
            <h2>📁 My Projects</h2>
            <div id="projects-list">
                <div class="loading">Loading...</div>
            </div>
        </div>
        <div class="main" id="main-content">
            <div class="welcome">
                <h2>Welcome to your Dashboard</h2>
                <p>Select a project from the sidebar to view documentation</p>
            </div>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('autodoc_token');
        let projects = [];
        let allDocs = {};

        async function init() {
            if (!token) {
                document.getElementById('login-prompt').style.display = 'block';
                return;
            }
            await loadDashboard();
        }

        async function loadWithToken() {
            token = document.getElementById('token-input').value.trim();
            if (!token) return;
            const ok = await loadDashboard();
            if (ok) localStorage.setItem('autodoc_token', token);
        }

        async function loadDashboard() {
            try {
                const res = await fetch('/api/v1/projects', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) {
                    document.getElementById('login-prompt').style.display = 'block';
                    document.getElementById('app-layout').style.display = 'none';
                    if (res.status === 401) {
                        document.getElementById('token-error').textContent = 'Invalid API key. Please try again.';
                        localStorage.removeItem('autodoc_token');
                    }
                    return false;
                }
                const data = await res.json();
                projects = data.projects;
                document.getElementById('login-prompt').style.display = 'none';
                document.getElementById('app-layout').style.display = 'flex';
                renderProjects();
                return true;
            } catch (err) {
                document.getElementById('token-error').textContent = 'Network error. Please try again.';
                return false;
            }
        }

        function renderProjects() {
            const list = document.getElementById('projects-list');
            if (projects.length === 0) {
                list.innerHTML = '<div class="empty">No projects yet.<br>Start writing code!</div>';
                return;
            }
            list.innerHTML = projects.map(p => `
                <div class="project">
                    <div class="project-name" onclick="loadProject('${p.id}', this)">
                        📁 ${p.name}
                    </div>
                    <div class="project-files" id="files-${p.id}"></div>
                </div>
            `).join('');
        }

        async function loadProject(projectId, el) {
            document.querySelectorAll('.project-name').forEach(e => e.classList.remove('active'));
            el.classList.add('active');

            const main = document.getElementById('main-content');
            main.innerHTML = '<div class="loading">Loading documentation...</div>';

            try {
                const res = await fetch(`/api/v1/documentation/${projectId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                const docs = data.documentation;

                if (docs.length === 0) {
                    main.innerHTML = '<div class="empty">No documentation yet.<br>Start writing code in VSCode!</div>';
                    return;
                }

                const byFile = {};
                for (const doc of docs) {
                    if (!byFile[doc.file_path]) byFile[doc.file_path] = [];
                    byFile[doc.file_path].push(doc);
                }

                const filesEl = document.getElementById(`files-${projectId}`);
                filesEl.innerHTML = Object.keys(byFile).map(f => `
                    <div class="file-item" onclick="showFile('${projectId}', '${f.replace(/'/g, "\\'")}')">
                        📄 ${f.split(/[/\\]/).pop()}
                    </div>
                `).join('');

                allDocs[projectId] = byFile;
                const firstFile = Object.keys(byFile)[0];
                showFile(projectId, firstFile);

            } catch (err) {
                main.innerHTML = '<div class="empty">Error loading documentation.</div>';
            }
        }

        function showFile(projectId, filePath) {
            document.querySelectorAll('.file-item').forEach(e => e.classList.remove('active'));
            const docs = allDocs[projectId]?.[filePath] || [];
            const main = document.getElementById('main-content');

            main.innerHTML = `
                <h2 style="font-size:16px;color:#8b949e;margin-bottom:20px;font-family:monospace;">${filePath.split(/[/\\]/).pop()}</h2>
                ${docs.map(d => `
                    <div class="doc-card">
                        <h3>\`${d.function_name}\`</h3>
                        <div class="doc-content">${d.doc_content}</div>
                    </div>
                `).join('')}
            `;
        }

        function logout() {
            localStorage.removeItem('autodoc_token');
            token = null;
            document.getElementById('app-layout').style.display = 'none';
            document.getElementById('login-prompt').style.display = 'block';
        }

        init();
    </script>
</body>
</html>
