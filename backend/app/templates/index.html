<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Doc Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            background: #f0f2f5;
        }

        .card {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* Left panel */
        .left {
            width: 380px;
            background: linear-gradient(160deg, #2ecc99, #1aaa77);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 48px;
            text-align: center;
            flex-shrink: 0;
        }

        .left .brand {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 40px;
        }

        .left h2 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .left p {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 40px;
            line-height: 1.7;
        }

        .left button {
            background: transparent;
            border: 2px solid white;
            color: white;
            padding: 12px 40px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .left button:hover {
            background: white;
            color: #1aaa77;
        }

        /* Right panel */
        .right {
            flex: 1;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 80px;
        }

        .right h2 {
            font-size: 28px;
            font-weight: 700;
            color: #222;
            margin-bottom: 8px;
        }

        .right .subtitle {
            font-size: 14px;
            color: #999;
            margin-bottom: 36px;
        }

        .input-group {
            position: relative;
            width: 100%;
            max-width: 420px;
            margin-bottom: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px 14px 44px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            outline: none;
            background: #fafafa;
            transition: border-color 0.2s, background 0.2s;
        }

        .input-group input:focus {
            border-color: #2ecc99;
            background: white;
        }

        .input-group svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #ccc;
        }

        .submit-btn {
            width: 100%;
            max-width: 420px;
            padding: 14px;
            background: #2ecc99;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 8px;
            transition: background 0.2s;
        }

        .submit-btn:hover { background: #1aaa77; }
        .submit-btn:disabled { background: #ccc; cursor: not-allowed; }

        .error {
            width: 100%;
            max-width: 420px;
            background: #fff5f5;
            border: 1px solid #fed7d7;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 13px;
            color: #e53e3e;
            margin-bottom: 16px;
            display: none;
        }

        .api-key-box {
            display: none;
            width: 100%;
            max-width: 420px;
            margin-top: 24px;
            background: #f0fdf8;
            border: 1px solid #b2f0d8;
            border-radius: 8px;
            padding: 20px;
        }

        .api-key-box .key-label {
            font-size: 12px;
            font-weight: 600;
            color: #1aaa77;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .key-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .key-value {
            flex: 1;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            color: #333;
            background: white;
            border: 1px solid #d0f0e4;
            border-radius: 6px;
            padding: 10px 12px;
            word-break: break-all;
            line-height: 1.5;
        }

        .copy-btn {
            padding: 10px 20px;
            background: #2ecc99;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .copy-btn:hover { background: #1aaa77; }

        .copied {
            font-size: 12px;
            color: #2ecc99;
            text-align: center;
            margin-top: 8px;
            display: none;
            font-weight: 600;
        }

        .api-key-box .hint {
            font-size: 12px;
            color: #888;
            margin-top: 12px;
            line-height: 1.6;
        }

        .api-key-box .hint code {
            background: #e8f8f2;
            padding: 1px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            color: #1aaa77;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="left" id="left-panel">
            <div class="brand">Auto-Doc Agent</div>
            <h2>Welcome Back</h2>
            <p>Sign in to access your API key and start generating documentation automatically as you write code.</p>
            <button onclick="switchTo('register')">Create Account</button>
        </div>

        <div class="right">
            <h2 id="panel-title">Sign In</h2>
            <p class="subtitle" id="panel-subtitle">Enter your email and password to continue</p>

            <div id="error" class="error"></div>

            <div class="input-group">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
                </svg>
                <input type="email" id="email" placeholder="Email address" />
            </div>

            <div class="input-group">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input type="password" id="password" placeholder="Password"
                    onkeydown="if(event.key==='Enter') submit()" />
            </div>

            <button class="submit-btn" id="submit-btn" onclick="submit()">Sign In</button>

            <div class="api-key-box" id="api-key-box">
                <div class="key-label">Your API Key</div>
                <div class="key-row">
                    <div class="key-value" id="key-value"></div>
                    <button class="copy-btn" onclick="copyKey()">Copy</button>
                </div>
                <div class="copied" id="copied">Copied to clipboard</div>
                <div class="hint">
                    Add this to your VS Code settings under <code>autoDocAgent.apiKey</code>
                </div>
            </div>
        </div>
    </div>

    <script>
        let mode = 'login';

        function switchTo(newMode) {
            mode = newMode;
            const isLogin = mode === 'login';
            document.getElementById('panel-title').textContent = isLogin ? 'Sign In' : 'Create Account';
            document.getElementById('panel-subtitle').textContent = isLogin
                ? 'Enter your email and password to continue'
                : 'Create your account to get started';
            document.getElementById('submit-btn').textContent = isLogin ? 'Sign In' : 'Sign Up';
            document.getElementById('left-panel').innerHTML = isLogin
                ? `<div class="brand">Auto-Doc Agent</div><h2>Welcome Back</h2><p>Sign in to access your API key and start generating documentation automatically as you write code.</p><button onclick="switchTo('register')">Create Account</button>`
                : `<div class="brand">Auto-Doc Agent</div><h2>Already have an account?</h2><p>Sign in to access your existing API key and documentation dashboard.</p><button onclick="switchTo('login')">Sign In</button>`;
            document.getElementById('error').style.display = 'none';
            document.getElementById('api-key-box').style.display = 'none';
        }

        async function submit() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submit-btn');
            const errorEl = document.getElementById('error');

            if (!email || !password) {
                showError('Please enter your email and password.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Please wait...';
            errorEl.style.display = 'none';

            const endpoint = mode === 'login' ? '/auth/login' : '/auth/register';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });

                const data = await res.json();

                if (!res.ok) {
                    showError(data.detail || 'Something went wrong. Please try again.');
                    return;
                }

                document.getElementById('key-value').textContent = data.access_token;
                document.getElementById('api-key-box').style.display = 'block';

            } catch {
                showError('Network error. Please try again.');
            } finally {
                btn.disabled = false;
                btn.textContent = mode === 'login' ? 'Sign In' : 'Sign Up';
            }
        }

        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = msg;
            el.style.display = 'block';
        }

        async function copyKey() {
            const key = document.getElementById('key-value').textContent;
            await navigator.clipboard.writeText(key);
            const el = document.getElementById('copied');
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 2000);
        }
    </script>
</body>
</html>
