name: Push Metrics to Grafana Cloud

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  push-metrics:
    runs-on: ubuntu-latest
    env:
      GRAFANA_URL: ${{ secrets.GRAFANA_PROMETHEUS_URL }}
      GRAFANA_USER: ${{ secrets.GRAFANA_PROMETHEUS_USER }}
      GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}

    steps:
      - name: Debug secrets
        run: |
          echo "URL length: ${#GRAFANA_URL}"
          echo "USER length: ${#GRAFANA_USER}"
          echo "TOKEN length: ${#GRAFANA_TOKEN}"
          echo "USER value: ${GRAFANA_USER}"

      - name: Test curl directly
        run: |
          curl -v -u "${GRAFANA_USER}:${GRAFANA_TOKEN}" \
            "${GRAFANA_URL}" \
            -X POST \
            -H "Content-Type: application/x-protobuf" \
            --data "" 2>&1 | grep -E "HTTP|error|auth"
