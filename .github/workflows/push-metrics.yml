name: Push Metrics to Grafana Cloud

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes
  workflow_dispatch:

jobs:
  push-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Install Prometheus tools
        run: |
          wget https://github.com/prometheus/prometheus/releases/download/v2.45.0/prometheus-2.45.0.linux-amd64.tar.gz
          tar xvf prometheus-2.45.0.linux-amd64.tar.gz
          sudo mv prometheus-2.45.0.linux-amd64/promtool /usr/local/bin/

      - name: Scrape and push metrics
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_PROMETHEUS_URL }}
          GRAFANA_USER: ${{ secrets.GRAFANA_PROMETHEUS_USER }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
          RENDER_URL: https://auto-doc-agent.onrender.com
        run: |
          curl -s "$RENDER_URL/metrics" -o metrics.txt
          curl -X POST "$GRAFANA_URL" \
            -u "$GRAFANA_USER:$GRAFANA_TOKEN" \
            --data-binary @metrics.txt \
            -H "Content-Type: text/plain"
