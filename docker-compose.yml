

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    command: uv run uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    volumes:
      - .:/app
    command: uv run celery -A backend.app.queue.celery_app worker --loglevel=info
    depends_on:
      - backend
    restart: unless-stopped

  flower:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5555:5555"
    env_file:
      - .env
    volumes:
      - .:/app
    command: uv run celery -A backend.app.queue.celery_app flower --port=5555
    depends_on:
      - worker
    restart: unless-stopped
